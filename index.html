<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InspireCreativity</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ECECEC; background: #0B0B0F;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .card {
    max-width: 560px; width: 100%;
    background: linear-gradient(180deg, #15151C, #0E0E13);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 40px 36px;
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
    color: #1A0E00; padding: 4px 10px; border-radius: 99px;
    background: linear-gradient(135deg, #FFD479, #E8A33D); margin-bottom: 20px;
  }
  h1 { font-size: 30px; font-weight: 800; margin: 0 0 10px; }
  p { color: rgba(255,255,255,0.65); margin: 0 0 24px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.btn {
    display: block; text-decoration: none; color: #fff;
    padding: 14px 18px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.03); font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
  }
  a.btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.25); }
  .foot { margin-top: 28px; font-size: 13px; color: rgba(255,255,255,0.4); }
  .foot a { color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">★ INSPIRECREATIVITY</span>
    <h1>InspireCreativity</h1>
    <p>A hand-crafted catalog of SwiftUI animations — browse, preview, and copy production-ready code straight into Xcode.</p>
    <div class="links">
      <a class="btn" href="./privacy/">Privacy Policy</a>
      <a class="btn" href="./terms/">Terms of Use (EULA)</a>
    </div>
    <p class="foot">Support: <a href="mailto:support@inspirecreativity.app">support@inspirecreativity.app</a></p>
  </div>
</body>
</html>
